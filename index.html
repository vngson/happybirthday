<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>A moment in time — Birthday</title>
    <meta name="description" content="A personal birthday celebration with a countdown, music and fireworks.">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icon/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon/apple-touch-icon.png">
    <link rel="stylesheet" href="./assets/css/base.css">
    <script defer src="./config.js"></script>
    <script defer src="./assets/js/birthday.js"></script>
    <script defer src="./assets/js/effects.js"></script>
  </head>
  <body>
    <div class="nebula" aria-hidden="true">
      <i></i>
      <i></i>
      <i></i>
    </div>
    <canvas id="cinema" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="halo" aria-hidden="true"></div>
    <header>
      <div class="brand" data-text="brand"></div>
    </header>
    <main class="shell">
      <noscript>
        <p>Please enable JavaScript to see the live countdown and celebration.</p>
      </noscript>
      <section class="scene" id="countdown">
        <div class="eyebrow" data-text="countdownEyebrow"></div>
        <h1 id="countdown-title"><span data-text="countdownTitle"></span> <em data-text="countdownAccent"></em>
        </h1>
        <p class="sub" data-text="countdownMessage"></p>
        <div class="clock" aria-label="Birthday countdown">
          <div class="unit">
            <span class="num" id="days">00</span>
            <small data-text="days"></small>
          </div>
          <div class="unit">
            <span class="num" id="hours">00</span>
            <small data-text="hours"></small>
          </div>
          <div class="unit">
            <span class="num" id="minutes">00</span>
            <small data-text="minutes"></small>
          </div>
          <div class="unit">
            <span class="num" id="seconds">00</span>
            <small data-text="seconds"></small>
          </div>
        </div>
        <div class="date" id="date"></div>
      </section>
      <section class="scene birthday" id="birthday" hidden>
        <div class="eyebrow" data-text="birthdayEyebrow"></div>
        <div class="age" id="age"></div>
        <h1 id="birthday-title"><span data-text="birthdayTitle"></span> <em data-text="birthdayAccent"></em>
        </h1>
        <p class="sub" data-text="birthdayMessage"></p>
        <button type="button" class="cta music" id="music" aria-pressed="false">
          <span class="bars">
            <i></i>
            <i></i>
            <i></i>
          </span>
          <span id="musicText" data-text="playMusic"></span>
        </button>
        <button type="button" class="secondary" id="celebrate" data-text="celebrate"></button>
        <div class="date" data-text="wishHint"></div>
        <button type="button" class="wish" data-text="wishButton"></button>
        <p class="wish-note" aria-live="polite"></p>
      </section>
    </main>
    <footer>
      <span><span id="footer-date"></span> · <span data-text="footerCelebration"></span></span>
      <span data-text="footerCredit"></span>
    </footer>
    <audio preload="none">
    </audio>
  </body>
</html>
